{% extends "_standalone.html" %}
{% import "_ui.html" as ui with context %}
{% block title %}{{ title }} – {{ brand.brand_name }}{% endblock %}
{% block body %}
<div class="stack-s center">
  <p class="xs muted m0">Error {{ code }}</p>
  <h1 class="title-s">{{ title }}</h1>
  <p class="muted m0">{{ body }}</p>
</div>
<a class="btn primary block" href="{{ home }}">{{ 'Back to your dashboard' if signed_in else 'Sign in' }}</a>
{% endblock %}
